<!DOCTYPE html>
<html lang="en">
  <head>
<script>
(function(){
  var STALE_KEYS = /currentRoute|activeTab|breadcrumb|sidebarItem|workspaceRoute|hrms_route|lastRoute|selectedWorkspace|navState/i;
  Object.keys(localStorage).forEach(function(k){
    if(STALE_KEYS.test(k)){
      localStorage.removeItem(k);
      console.log('[slhrms] cleared stale key:', k);
    }
  });
})();
</script>
<script>
(function(){
  var _reg = navigator.serviceWorker.register.bind(navigator.serviceWorker);
  navigator.serviceWorker.register = function(u, o) {
    if (String(u).includes('sw.js')) { console.log('[slhrms] SW blocked:', u); return Promise.resolve(); }
    return _reg(u, o);
  };
})();
</script>
<script>
navigator.serviceWorker.getRegistrations().then(function(rs) {
  rs.forEach(function(r) { r.unregister(); });
});
</script>
